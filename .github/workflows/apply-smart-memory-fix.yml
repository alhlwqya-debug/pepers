name: Apply smart shop memory fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch WorkLogSheet
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/kotlin/com/add/pepers/WorkLogSheet.kt")
          s = p.read_text(encoding="utf-8")

          replacements = [
              (
                  "var selectedShopId by remember { mutableStateOf(shops.firstOrNull()?.id) }",
                  "var selectedShopId by remember {\n"
                  "    mutableStateOf(\n"
                  "        SmartShopMemory.lastShopId(context)?.takeIf { id -> shops.any { it.id == id } }\n"
                  "            ?: shops.firstOrNull()?.id\n"
                  "    )\n"
                  "}",
              ),
              (
                  "var registrationMode by remember(selectedShopId, shops) {\n"
                  "    mutableStateOf(\n"
                  "        shops.firstOrNull { it.id == selectedShopId }?.registrationMode\n"
                  "            ?: RegistrationMode.NUMERIC\n"
                  "    )\n"
                  "}",
                  "var registrationMode by remember(selectedShopId, shops) {\n"
                  "    mutableStateOf(\n"
                  "        selectedShopId?.let { id ->\n"
                  "            SmartShopMemory.resolveMode(\n"
                  "                context,\n"
                  "                id,\n"
                  "                shops.firstOrNull { it.id == id }?.registrationMode\n"
                  "            )\n"
                  "        } ?: RegistrationMode.NUMERIC\n"
                  "    )\n"
                  "}",
              ),
              (
                  "        shops = database.getShops()\n"
                  "        if (shops.none { it.id == selectedShopId }) selectedShopId = shops.firstOrNull()?.id\n"
                  "        registrationMode = shops.firstOrNull { it.id == selectedShopId }?.registrationMode\n"
                  "            ?: RegistrationMode.NUMERIC",
                  "        shops = database.getShops()\n"
                  "        if (shops.none { it.id == selectedShopId }) {\n"
                  "            selectedShopId = SmartShopMemory.lastShopId(context)?.takeIf { id -> shops.any { it.id == id } }\n"
                  "                ?: shops.firstOrNull()?.id\n"
                  "        }\n"
                  "        registrationMode = selectedShopId?.let { id ->\n"
                  "            SmartShopMemory.resolveMode(\n"
                  "                context,\n"
                  "                id,\n"
                  "                shops.firstOrNull { it.id == id }?.registrationMode\n"
                  "            )\n"
                  "        } ?: RegistrationMode.NUMERIC",
              ),
              (
                  "    LaunchedEffect(selectedShopId) {\n"
                  "        registrationMode = shops.firstOrNull { it.id == selectedShopId }?.registrationMode\n"
                  "            ?: RegistrationMode.NUMERIC",
                  "    LaunchedEffect(selectedShopId) {\n"
                  "        selectedShopId?.let { SmartShopMemory.rememberShop(context, it) }\n"
                  "        registrationMode = selectedShopId?.let { id ->\n"
                  "            SmartShopMemory.resolveMode(\n"
                  "                context,\n"
                  "                id,\n"
                  "                shops.firstOrNull { it.id == id }?.registrationMode\n"
                  "            )\n"
                  "        } ?: RegistrationMode.NUMERIC",
              ),
              (
                  "                onSelectShop = { id ->\n"
                  "                    selectedShopId = id\n"
                  "                    registrationMode = database.getShops().firstOrNull { it.id == id }?.registrationMode ?: RegistrationMode.NUMERIC",
                  "                onSelectShop = { id ->\n"
                  "                    SmartShopMemory.rememberShop(context, id)\n"
                  "                    val persistedMode = database.getShops().firstOrNull { it.id == id }?.registrationMode\n"
                  "                    SmartShopMemory.modeForShop(context, id)?.let { SmartShopMemory.rememberMode(context, id, it) }\n"
                  "                    selectedShopId = id\n"
                  "                    registrationMode = SmartShopMemory.resolveMode(context, id, persistedMode)",
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit("Patch anchor not found")
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/add/pepers/WorkLogSheet.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: remember last shop and registration mode"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-smart-memory-fix.yml
          git commit -m "chore: remove temporary smart memory patch workflow"
          git push
