name: Build and Publish Pepers Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set English build locale
        run: |
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          test -s app/release.jks

      - name: Verify signing secrets
        env:
          PEPERS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PEPERS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PEPERS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$PEPERS_KEYSTORE_PASSWORD"
          test -n "$PEPERS_KEY_PASSWORD"
          test -n "$PEPERS_KEY_ALIAS"
          keytool -list -keystore app/release.jks -alias "$PEPERS_KEY_ALIAS" -storepass "$PEPERS_KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed release APK and AAB
        env:
          PEPERS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PEPERS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PEPERS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pepers-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release and upload APK/AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "Pepers $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Remove signing material
        if: always()
        run: rm -f app/release.jks
