name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          test -s app/release.jks

      - name: Verify signing configuration
        env:
          PEPERS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PEPERS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PEPERS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$PEPERS_KEYSTORE_PASSWORD"
          test -n "$PEPERS_KEY_PASSWORD"
          test -n "$PEPERS_KEY_ALIAS"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          PEPERS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PEPERS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PEPERS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pepers-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f app/release.jks
